name: diploma-task-app
services:
  backend:
    build:
      context: C:\diplomova_prace\backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      APP_NAME: Diploma Task App
      APP_VERSION: dev
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql+psycopg://taskapp:change-me@db:5432/taskapp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      default: null
    restart: unless-stopped
  db:
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_PASSWORD: change-me
      POSTGRES_USER: taskapp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 10s
    image: postgres:18-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
        volume: {}
  frontend:
    build:
      context: C:\diplomova_prace\frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
networks:
  default:
    name: diploma-task-app_default
volumes:
  postgres-data:
    name: diploma-task-app_postgres-data
