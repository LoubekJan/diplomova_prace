apiVersion: v1
kind: PersistentVolume
metadata:
  name: task-app-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=4.1
  nfs:
    server: 192.168.0.248
    path: /srv/okd-postgres
