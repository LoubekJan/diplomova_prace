apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task-app
resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
patches:
  - target:
      kind: ConfigMap
      name: app-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: https://task-app.example.test
